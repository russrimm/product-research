name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The lockfile resolves packages via an internal feed; point it at the public registry.
      - run: sed -i -E 's#https://ms-feed-[^"]*/npm/registry/#https://registry.npmjs.org/#' package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          skip_app_build: true
          app_location: out
